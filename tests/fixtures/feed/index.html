<!DOCTYPE html>
<html lang="ko">
<head><meta charset="utf-8"><title>익명토론 - 자유로운 토론</title>
<style>
  body { margin: 0; font-family: sans-serif; background: #1a1a1a; color: #eee; }
  #loading { position: fixed; inset: 0; background: #000; color: #fff; display: flex; flex-direction: column;
             align-items: center; justify-content: center; font-size: 20px; z-index: 50; }
  .hero { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .hero h1 { font-size: 64px; margin: 0 0 40px; }
  .cta { display: inline-block; padding: 20px 48px; border: 1px solid #555; border-radius: 40px; color: #fff;
         text-decoration: none; font-size: 22px; }
  .side { position: fixed; right: 20px; top: 40%; }
  .side a { display: block; color: #ccc; margin: 12px 0; text-decoration: none; }
  section { min-height: 60vh; padding: 40px; }
  #app { background: #fff; color: #111; }
  #feed { padding: 20px 40px; }
  .post { border-bottom: 1px solid #ddd; padding: 24px 0; min-height: 220px; }
  .media { position: relative; width: 400px; height: 160px; }
  .media img { width: 400px; height: 160px; filter: blur(12px); background: #446; }
  .reveal { position: absolute; left: 150px; top: 65px; background: #333; color: #fff; padding: 4px 10px;
            border-radius: 6px; cursor: pointer; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; background: #f5f7fb; padding: 24px; z-index: 30; }
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 20; display: flex;
              align-items: center; justify-content: center; }
  .modal { background: #a5b4fc; color: #111; padding: 30px; border-radius: 12px; width: 420px; }
  .more-btn { display: block; margin: 20px auto; padding: 12px 30px; }
</style></head>
<body>
  <div id="loading" style="display:none"><div>익명토론</div><div id="loading-text"></div></div>
  <div id="landing">
    <div class="hero" id="hero">
      <h1>회원가입 없이, 바로 익명.</h1>
      <a class="cta" href="javascript:startSite()">지금, 익명으로 시작하기 &gt;</a>
      <p>지금까지 6,195개의 생각이 공유되었습니다.</p>
    </div>
    <nav class="side">
      <a href="#hero">Hero</a><a href="#about">About</a><a href="#guideline">Guideline</a>
      <a href="#faq">FAQ</a><a href="#start">시작하기</a>
    </nav>
    <section id="about"><h2>About</h2><p>누구나 익명으로 생각을 나누는 공간입니다.</p></section>
    <section id="guideline"><h2>Guideline</h2><p>서로 존중해 주세요.</p></section>
    <section id="faq"><h2>FAQ</h2><p>가입이 필요한가요? 아니요.</p></section>
    <section id="start"><h2>시작하기</h2><p>위의 버튼을 눌러 시작하세요.</p></section>
  </div>
  <div id="app"></div>
  <footer class="site-footer">
    <a href="/terms.html">이용약관</a> | <a href="/privacy.html">개인정보처리방침</a> | <a href="/guide.html">서비스 안내</a>
  </footer>
  <script>
    function clickLog(name) { fetch('/clicked/' + name); }
    history.replaceState({}, '', '/?sec=hero');

    var posts = [];
    for (var i = 1; i <= 30; i++) {
      var title = '익명 ' + i + '번째 생각';
      var comment = '좋은 글이네요';
      var extra = '';
      var media = '';
      if (i === 3) title = '양파 원조교제하다';
      if (i % 4 === 0) media = '<div class="media"><img alt=""><div class="reveal" onclick="clickLog(\'reveal\')">클릭하여 더보기</div></div>';
      if (i === 12) comment = '토토사이트 추천 가입코드 777 텔레그램 @toto777';
      if (i === 27) extra = '<div class="c" style="display:none"><a href="http://casino.invalid/">카지노 먹튀검증 바로가기</a></div>';
      posts.push('<div class="post" id="post-' + i + '"><h3>' + title + '</h3>' + media +
                 '<p>오늘 있었던 일을 적어 봅니다. 글 번호 ' + i + '</p><button>추천 (0)</button> <button>비추천 (0)</button>' +
                 '<ul class="comments"><li>' + comment + '</li></ul>' + extra + '</div>');
    }
    var shown = 0, busy = false;

    function startSite() {
      clickLog('start');
      var loading = document.getElementById('loading');
      loading.style.display = 'flex';
      var pct = 0;
      var timer = setInterval(function () {
        pct += 12;
        document.getElementById('loading-text').textContent = '스타일시트 다운로드 중 ' + pct + '%';
      }, 300);
      setTimeout(function () {
        clearInterval(timer);
        loading.style.display = 'none';
        document.getElementById('landing').style.display = 'none';
        document.getElementById('app').innerHTML = '<div id="feed"></div><div id="more-area"></div>' +
          '<div class="sheet"><b>이용약관, 개인정보처리방침 및 보안정책</b><p>본 사이트를 이용함으로써 약관에 동의하는 것으로 간주됩니다.</p>' +
          '<button onclick="clickLog(\'agree\')">동의</button></div>' +
          '<div class="modal-bg"><div class="modal"><h3>공식 디스코드에 가입하세요!</h3>' +
          '<button onclick="clickLog(\'discord\')">지금 가입하기</button> ' +
          '<button onclick="clickLog(\'later\')">나중에 하기</button></div></div>';
        append();
        window.addEventListener('scroll', function () {
          if (shown < 20 && window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 200) append();
        });
      }, 2500);
    }

    function append() {
      if (busy || shown >= posts.length) return;
      busy = true;
      setTimeout(function () {
        document.getElementById('feed').insertAdjacentHTML('beforeend', posts.slice(shown, shown + 5).join(''));
        shown += 5;
        busy = false;
        var area = document.getElementById('more-area');
        area.innerHTML = shown >= 20 && shown < posts.length
          ? '<button class="more-btn" onclick="clickLog(\'more\'); append()">게시글 더 불러오기</button>' : '';
      }, 400);
    }
  </script>
</body>
</html>
